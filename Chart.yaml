name: forgejo
annotations:
  category: DevelopmentTools
  artifacthub.io/license: MIT
  artifacthub.io/images: |
    - name: forgejo
      image: codeberg.org/forgejo/forgejo:15.0.3-rootless
    - name: os-shell
      image: docker.io/bitnami/os-shell:latest
    - name: postgresql
      image: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie
apiVersion: v2
appVersion: 15.0.3
dependencies:
- name: common
  repository: oci://registry-1.docker.io/bitnamicharts
