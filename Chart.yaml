description: Forgejo is a lightweight code hosting solution. Written in Go, features low resource consumption, easy upgrades and multiple databases.
home: https://lab.frogg.it/doca/forgejo-helm
icon: https://codeberg.org/forgejo/forgejo/raw/branch/forgejo/assets/logo.svg
keywords:
  - forgejo
maintainers:
  - name: Benoît Pourre
    email: benoit.pourre@gmail.com
    url: https://github.com/captnbp
sources:
  - https://lab.frogg.it/doca/forgejo-helm
