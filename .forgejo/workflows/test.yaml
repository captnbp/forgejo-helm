name: Helm CI/CD

on:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # - name: Setup Helm
      #   uses: azure/setup-helm@v5
      #   # with:
      #   #   version: 'v3.15.0'

      - name: Verify Helm
        run: helm version

      - name: Update Dependencies
        run: helm dependency update

      - name: Lint Chart
        run: helm lint .

      - name: Template Check
        run: helm template . --debug
