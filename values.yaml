## @section Global parameters
## Global Docker image parameters
## Please, note that this will override the image parameters, including dependencies, configured to use the global value
## Current available global Docker image parameters: imageRegistry, imagePullSecrets and storageClass
##

## @param global.imageRegistry Global Docker image registry
## @param global.imagePullSecrets Global Docker registry secret names as an array
## @param global.storageClass Global StorageClass for Persistent Volume(s)
##
global:
  imageRegistry: ""
  ## E.g.
  ## imagePullSecrets:
  ##   - myRegistryKeySecretName
  ##
  imagePullSecrets: []
  storageClass: ""
## @section Common parameters
##

## @param kubeVersion Force target Kubernetes version (using Helm capabilities if not set)
##
kubeVersion: ""
## @param nameOverride String to partially override forgejo.fullname template (will maintain the release name)
##
nameOverride: ""
## @param fullnameOverride String to fully override forgejo.fullname template
##
fullnameOverride: ""
## @param namespaceOverride String to fully override common.names.namespace
##
namespaceOverride: ""
## @param commonAnnotations Common annotations to add to all Forgejo resources (sub-charts are not considered). Evaluated as a template
##
commonAnnotations: {}
## @param commonLabels Common labels to add to all Forgejo resources (sub-charts are not considered). Evaluated as a template
##
commonLabels: {}
## @param clusterDomain Default Kubernetes cluster domain
##
clusterDomain: cluster.local
## @param extraDeploy Array of extra objects to deploy with the release (evaluated as a template).
##
extraDeploy: []
## @section Forgejo parameters
##

## Diagnostic mode
## @param diagnosticMode.enabled Enable diagnostic mode (all probes will be disabled and the command will be overridden)
## @param diagnosticMode.command Command to override all containers in the chart release
## @param diagnosticMode.args Args to override all containers in the chart release
##
diagnosticMode:
  enabled: false
  command:
    - sleep
  args:
    - infinity

## Bitnami Forgejo image version
## ref: https://hub.docker.com/r/bitnami/forgejo/tags/
## @param image.registry [default: REGISTRY_NAME] Forgejo image registry
## @param image.repository [default: REPOSITORY_NAME/forgejo] Forgejo Image name
## @skip image.tag Forgejo Image tag
## @param image.digest Forgejo image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
## @param image.pullPolicy Forgejo image pull policy
## @param image.pullSecrets Specify docker-registry secret names as an array
##
image:
  registry: codeberg.org
  repository: forgejo/forgejo
  tag: 17.0.0-rootless
  digest: ""
  ## Specify a imagePullPolicy
  ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
  ## ref: https://kubernetes.io/docs/concepts/containers/images/#pre-pulled-images
  ##
  pullPolicy: IfNotPresent
  ## Optionally specify an array of imagePullSecrets.
  ## Secrets must be manually created in the namespace.
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ## e.g:
  ## pullSecrets:
  ##   - myRegistryKeySecretName
  ##
  pullSecrets: []
## @param appName Forgejo application name
## ref: https://github.com/bitnami/containers/tree/main/bitnami/forgejo#configuration
##
appName: example
## @param runMode Forgejo application host
## ref: https://github.com/bitnami/containers/tree/main/bitnami/forgejo#configuration
##
runMode: prod
## @param rootURL UI Root URL (for link generation)
##
rootURL: ""
## @param enableReverseProxyAuthentication Enable reverse proxy authentication (for reverse proxy setups)
##
enableReverseProxyAuthentication: false
## @param trustedProxies Comma-separated list of trusted proxies (for reverse proxy setups)
##
trustedProxies: "10.0.0.0/8"
## @param command Override default container command (useful when using custom images)
##
command: []
## @param args Override default container args (useful when using custom images)
##
args: []
## @param updateStrategy.type Update strategy - only really applicable for deployments with RWO PVs attached
## If replicas = 1, an update can get "stuck", as the previous pod remains attached to the
## PV, and the "incoming" pod can never start. Changing the strategy to "Recreate" will
## terminate the single previous pod, so that the new, incoming pod can attach to the PV
##
updateStrategy:
  type: Recreate
## @param replicaCount Number of Forgejo replicas to deploy
##
replicaCount: 1
## @param priorityClassName Forgejo pods' priorityClassName
##
priorityClassName: ""
## @param schedulerName Name of the k8s scheduler (other than default)
## ref: https://kubernetes.io/docs/tasks/administer-cluster/configure-multiple-schedulers/
##
schedulerName: ""
## @param topologySpreadConstraints Topology Spread Constraints for pod assignment
## https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/
## The value is evaluated as a template
##
topologySpreadConstraints: []
## @param automountServiceAccountToken Mount Service Account token in pod
##
automountServiceAccountToken: false
## @param hostAliases [array] Add deployment host aliases
## https://kubernetes.io/docs/concepts/services-networking/add-entries-to-pod-etc-hosts-with-host-aliases/
##
hostAliases: []
## @param extraEnvVars Extra environment variables
## For example:
##
extraEnvVars: []
# - name: FORGEJO__default__APP_NAME
#   value: "Git"
# - name: FORGEJO__security__MIN_PASSWORD_LENGTH
#   value: "16"
# - name: FORGEJO__security__PASSWORD_CHECK_PWN
#   value: "true"
# - name: FORGEJO__service__DISABLE_REGISTRATION
#   value: "true"
## @param extraEnvVarsCM ConfigMap containing extra env vars
##
extraEnvVarsCM: ""
## @param extraEnvVarsSecret Secret containing extra env vars (in case of sensitive data)
##
extraEnvVarsSecret: ""
## @param extraVolumes Array of extra volumes to be added to the deployment (evaluated as template). Requires setting `extraVolumeMounts`
##
extraVolumes: []
## @param extraVolumeMounts Array of extra volume mounts to be added to the container (evaluated as template). Normally used with `extraVolumes`.
##
extraVolumeMounts: []
## @param initContainers Add additional init containers to the pod (evaluated as a template)
##
initContainers: []
## @param sidecars Attach additional containers to the pod (evaluated as a template)
##
sidecars: []
## @param tolerations Tolerations for pod assignment
## Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
##
tolerations: []
## @param existingSecret Name of a secret with the application password
##
existingSecret: ""

## @param containerPorts [object] Container ports
##
containerPorts:
  http: 3000
  ssh: 2222
## Enable persistence using Persistent Volume Claims
## ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
##
persistence:
  ## @param persistence.enabled Enable persistence using PVC
  ##
  enabled: true
  ## @param persistence.storageClass PVC Storage Class for Forgejo volume
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
  ## If undefined (the default) or set to null, no storageClassName spec is
  ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
  ##   GKE, AWS & OpenStack)
  ##
  storageClass: ""
  ## @param persistence.accessModes PVC Access Mode for Forgejo volume
  ## Requires persistence.enabled: true
  ## If defined, PVC must be created manually before volume will be bound
  ##
  accessModes:
    - ReadWriteOnce
  ## @param persistence.size PVC Storage Request for Forgejo volume
  ##
  size: 8Gi
  ## @param persistence.dataSource Custom PVC data source
  ##
  dataSource: {}
  ## @param persistence.existingClaim A manually managed Persistent Volume Claim
  ## Requires persistence.enabled: true
  ## If defined, PVC must be created manually before volume will be bound
  ##
  existingClaim: ""
  ## @param persistence.hostPath If defined, the forgejo-data volume will mount to the specified hostPath.
  ## Requires persistence.enabled: true
  ## Requires persistence.existingClaim: nil|false
  ## Default: nil.
  ##
  hostPath: ""
  ## @param persistence.annotations Persistent Volume Claim annotations
  ##
  annotations: {}
  ## @param persistence.selector Selector to match an existing Persistent Volume for Forgejo data PVC
  ## If set, the PVC can't have a PV dynamically provisioned for it
  ## E.g.
  ## selector:
  ##   matchLabels:
  ##     app: my-app
  ##
  selector: {}
## @param podAffinityPreset Pod affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
##
podAffinityPreset: ""
## @param podAntiAffinityPreset Pod anti-affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
##
podAntiAffinityPreset: soft
## Node affinity preset
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#node-affinity
## @param nodeAffinityPreset.type Node affinity preset type. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## @param nodeAffinityPreset.key Node label key to match Ignored if `affinity` is set.
## @param nodeAffinityPreset.values Node label values to match. Ignored if `affinity` is set.
##
nodeAffinityPreset:
  type: ""
  ## E.g.
  ## key: "kubernetes.io/e2e-az-name"
  ##
  key: ""
  ## E.g.
  ## values:
  ##   - e2e-az1
  ##   - e2e-az2
  ##
  values: []
## @param affinity Affinity for pod assignment
## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
## Note: podAffinityPreset, podAntiAffinityPreset, and nodeAffinityPreset will be ignored when it's set
##
affinity: {}
## @param nodeSelector Node labels for pod assignment. Evaluated as a template.
## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
##
nodeSelector: {}
## Forgejo container's resource requests and limits
## ref: http://kubernetes.io/docs/concepts/configuration/manage-compute-resources-container/
## @param resourcesPreset Set container resources according to one common preset (allowed values: none, nano, small, medium, large, xlarge, 2xlarge). This is ignored if resources is set (resources is recommended for production).
## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
##
resourcesPreset: "none"
## @param resources Set container requests and limits for different resources like CPU or memory (essential for production workloads)
## Example:
## resources:
##   requests:
##     cpu: 2
##     memory: 512Mi
##   limits:
##     cpu: 3
##     memory: 1024Mi
##
resources: {}
## Configure Pods Security Context
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
## @param podSecurityContext.enabled Enable Forgejo pods' Security Context
## @param podSecurityContext.fsGroupChangePolicy Set filesystem group change policy
## @param podSecurityContext.sysctls Set kernel settings using the sysctl interface
## @param podSecurityContext.supplementalGroups Set filesystem extra groups
## @param podSecurityContext.fsGroup Forgejo pods' group ID
##
podSecurityContext:
  enabled: true
  fsGroupChangePolicy: Always
  sysctls: []
  supplementalGroups: []
  fsGroup: 1000
## Configure Container Security Context (only main container)
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
## @param containerSecurityContext.enabled Enabled containers' Security Context
## @param containerSecurityContext.seLinuxOptions [object,nullable] Set SELinux options in container
## @param containerSecurityContext.runAsUser Set containers' Security Context runAsUser
## @param containerSecurityContext.runAsNonRoot Set container's Security Context runAsNonRoot
## @param containerSecurityContext.privileged Set container's Security Context privileged
## @param containerSecurityContext.readOnlyRootFilesystem Set container's Security Context readOnlyRootFilesystem
## @param containerSecurityContext.allowPrivilegeEscalation Set container's Security Context allowPrivilegeEscalation
## @param containerSecurityContext.capabilities.drop List of capabilities to be dropped
## @param containerSecurityContext.capabilities.add List of capabilities to be added
## @param containerSecurityContext.seccompProfile.type Set container's Security Context seccomp profile
##
containerSecurityContext:
  enabled: true
  seLinuxOptions: null
  runAsUser: 1000
  runAsNonRoot: true
  privileged: false
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
    add: ["SYS_CHROOT"]
  seccompProfile:
    type: "RuntimeDefault"
## Configure extra options for startup probe
## Forgejo core exposes / to unauthenticated requests, making it a good
## default startup and readiness path. However, that may not always be the
## case. For example, if the image value is overridden to an image containing a
## module that alters that route, or an image that does not auto-install Forgejo.
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/#configure-probes
## @param startupProbe.enabled Enable startupProbe
## @param startupProbe.path Request path for startupProbe
## @param startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
## @param startupProbe.periodSeconds Period seconds for startupProbe
## @param startupProbe.timeoutSeconds Timeout seconds for startupProbe
## @param startupProbe.failureThreshold Failure threshold for startupProbe
## @param startupProbe.successThreshold Success threshold for startupProbe
##
startupProbe:
  enabled: false
  path: /
  initialDelaySeconds: 600
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5
  successThreshold: 1
## Configure extra options for liveness probe
## Forgejo core exposes / to unauthenticated requests, making it a good
## default liveness and readiness path. However, that may not always be the
## case. For example, if the image value is overridden to an image containing a
## module that alters that route, or an image that does not auto-install Forgejo.
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/#configure-probes
## @param livenessProbe.enabled Enable livenessProbe
## @param livenessProbe.path Request path for livenessProbe
## @param livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
## @param livenessProbe.periodSeconds Period seconds for livenessProbe
## @param livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
## @param livenessProbe.failureThreshold Failure threshold for livenessProbe
## @param livenessProbe.successThreshold Success threshold for livenessProbe
##
livenessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 600
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5
  successThreshold: 1
## Configure extra options for readiness probe
## Forgejo core exposes / to unauthenticated requests, making it a good
## default liveness and readiness path. However, that may not always be the
## case. For example, if the image value is overridden to an image containing a
## module that alters that route, or an image that does not auto-install Forgejo.
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/#configure-probes
## @param readinessProbe.enabled Enable readinessProbe
## @param readinessProbe.path Request path for readinessProbe
## @param readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
## @param readinessProbe.periodSeconds Period seconds for readinessProbe
## @param readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
## @param readinessProbe.failureThreshold Failure threshold for readinessProbe
## @param readinessProbe.successThreshold Success threshold for readinessProbe
##
readinessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 1
  failureThreshold: 5
  successThreshold: 1
## @param customStartupProbe Override default startup probe
##
customStartupProbe: {}
## @param customLivenessProbe Override default liveness probe
##
customLivenessProbe: {}
## @param customReadinessProbe Override default readiness probe
##
customReadinessProbe: {}
## @param lifecycleHooks LifecycleHook to set additional configuration at startup Evaluated as a template
##
lifecycleHooks: {}
## @param podAnnotations Pod annotations
## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
##
podAnnotations: {}
## @param podLabels Add additional labels to the pod (evaluated as a template)
## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
##
podLabels: {}
## @section Traffic Exposure Parameters
##

## Kubernetes configuration. For minikube, set this to NodePort, elsewhere use LoadBalancer
##
service:
  ## @param service.type Kubernetes Service type
  ##
  type: ClusterIP
  ## @param service.ports.http Service HTTP port
  ##
  ports:
    http: 3000
  ## @param service.loadBalancerSourceRanges Restricts access for LoadBalancer (only with `service.type: LoadBalancer`)
  ## e.g:
  ## loadBalancerSourceRanges:
  ##   - 0.0.0.0/0
  ##
  loadBalancerSourceRanges: []
  ## @param service.loadBalancerIP loadBalancerIP for the Forgejo Service (optional, cloud specific)
  ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#type-loadbalancer
  ##
  loadBalancerIP: ""
  ## @param service.nodePorts [object] Kubernetes node port
  ## nodePorts:
  ##   http: <to set explicitly, choose port between 30000-32767>
  ##
  nodePorts:
    http: ""
  ## @param service.externalTrafficPolicy Enable client source IP preservation
  ## ref https://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip
  ##
  externalTrafficPolicy: Cluster
  ## @param service.clusterIP Forgejo service Cluster IP
  ## e.g.:
  ## clusterIP: None
  ##
  clusterIP: ""
  ## @param service.extraPorts Extra ports to expose (normally used with the `sidecar` value)
  ##
  extraPorts: []
  ## @param service.annotations Additional custom annotations for Forgejo service
  ##
  annotations: {}
  ## @param service.sessionAffinity Session Affinity for Kubernetes service, can be "None" or "ClientIP"
  ## If "ClientIP", consecutive client requests will be directed to the same Pod
  ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#virtual-ips-and-service-proxies
  ##
  sessionAffinity: None
  ## @param service.sessionAffinityConfig Additional settings for the sessionAffinity
  ## sessionAffinityConfig:
  ##   clientIP:
  ##     timeoutSeconds: 300
  ##
  sessionAffinityConfig: {}
  ## @param service.ipFamilyPolicy Controller Service ipFamilyPolicy (optional, cloud specific)
  ## This can be either SingleStack, PreferDualStack or RequireDualStack
  ## ref: https://kubernetes.io/docs/concepts/services-networking/dual-stack/#services
  ##
  ipFamilyPolicy: "PreferDualStack"
  ## @param service.ipFamilies Controller Service ipFamilies (optional, cloud specific)
  ## This can be either ["IPv4"], ["IPv6"], ["IPv4", "IPv6"] or ["IPv6", "IPv4"]
  ## ref: https://kubernetes.io/docs/concepts/services-networking/dual-stack/#services
  ##
  ipFamilies: []


## @param ssh.enabled Make the SSH server accesible
##
ssh:
  enabled: false
  ## @param ssh.hostname Domain name of this server, used for displayed clone URL.
  hostname: git-ssh.local
  ## Kubernetes configuration. For minikube, set this to NodePort, elsewhere use LoadBalancer
  ##
  service:
    ## @param ssh.service.type Kubernetes Service type
    ##
    type: LoadBalancer
    ## @param ssh.service.ports.ssh Service SSH port
    ##
    ports:
      ssh: 22
    ## @param ssh.service.loadBalancerSourceRanges Restricts access for LoadBalancer (only with `service.type: LoadBalancer`)
    ## e.g:
    ## loadBalancerSourceRanges:
    ##   - 0.0.0.0/0
    ##
    loadBalancerSourceRanges: []
    ## @param ssh.service.loadBalancerIP loadBalancerIP for the Forgejo Service (optional, cloud specific)
    ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#type-loadbalancer
    ##
    loadBalancerIP: ""
    ## @param ssh.service.nodePorts [object] Kubernetes node port
    ## nodePorts:
    ##   https: <to set explicitly, choose port between 30000-32767>
    ##
    nodePorts:
      ssh: ""
    ## @param ssh.service.externalTrafficPolicy Enable client source IP preservation
    ## ref https://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip
    ##
    externalTrafficPolicy: Cluster
    ## @param ssh.service.clusterIP Forgejo service Cluster IP
    ## e.g.:
    ## clusterIP: None
    ##
    clusterIP: ""
    ## @param ssh.service.extraPorts Extra ports to expose (normally used with the `sidecar` value)
    ##
    extraPorts: []
    ## @param ssh.service.annotations Additional custom annotations for Forgejo service
    ##
    annotations: {}
    ## @param ssh.service.sessionAffinity Session Affinity for Kubernetes service, can be "None" or "ClientIP"
    ## If "ClientIP", consecutive client requests will be directed to the same Pod
    ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#virtual-ips-and-service-proxies
    ##
    sessionAffinity: None
    ## @param ssh.service.sessionAffinityConfig Additional settings for the sessionAffinity
    ## sessionAffinityConfig:
    ##   clientIP:
    ##     timeoutSeconds: 300
    ##
    sessionAffinityConfig: {}
    ## @param ssh.service.ipFamilyPolicy Controller Service ipFamilyPolicy (optional, cloud specific)
    ## This can be either SingleStack, PreferDualStack or RequireDualStack
    ## ref: https://kubernetes.io/docs/concepts/services-networking/dual-stack/#services
    ##
    ipFamilyPolicy: "PreferDualStack"
    ## @param ssh.service.ipFamilies Controller Service ipFamilies (optional, cloud specific)
    ## This can be either ["IPv4"], ["IPv6"], ["IPv4", "IPv6"] or ["IPv6", "IPv4"]
    ## ref: https://kubernetes.io/docs/concepts/services-networking/dual-stack/#services
    ##
    ipFamilies: []


## forgejo ingress parameters
## ref: http://kubernetes.io/docs/concepts/services-networking/ingress/
##
ingress:
  ## @param ingress.enabled Enable ingress record generation for forgejo
  ##
  enabled: true
  ## @param ingress.pathType Ingress path type
  ##
  pathType: ImplementationSpecific
  ## @param ingress.apiVersion Force Ingress API version (automatically detected if not set)
  ##
  apiVersion: ""
  ## @param ingress.hostname Default host for the ingress record
  ##
  hostname: forgejo.local
  ## @param ingress.ingressClassName IngressClass that will be be used to implement the Ingress (Kubernetes 1.18+)
  ## This is supported in Kubernetes 1.18+ and required if you have more than one IngressClass marked as the default for your cluster .
  ## ref: https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/
  ##
  ingressClassName: "traefik"
  ## @param ingress.ingressControllerType ingressControllerType that will be be used to implement the Ingress specific annotations (Ex. nginx or traefik)
  ingressControllerType: "traefik"
  ## @param ingress.path Default path for the ingress record
  ## NOTE: You may need to set this to '/*' in order to use this with ALB ingress controllers
  ##
  path: /
  ## @param ingress.annotations Additional annotations for the Ingress resource. To enable certificate autogeneration, place here your cert-manager annotations.
  ## Use this parameter to set the required annotations for cert-manager, see
  ## ref: https://cert-manager.io/docs/usage/ingress/#supported-annotations
  ## e.g:
  ## annotations:
  ##   kubernetes.io/ingress.class: nginx
  ##   cert-manager.io/cluster-issuer: cluster-issuer-name
  ##
  annotations: {}
  ## @param ingress.tls Enable TLS configuration for the host defined at `ingress.hostname` parameter
  ## TLS certificates will be retrieved from a TLS secret with name: `{{- printf "%s-tls" .Values.ingress.hostname }}`
  ## You can:
  ##   - Use the `ingress.secrets` parameter to create this TLS secret
  ##   - Rely on cert-manager to create it by setting the corresponding annotations
  ##   - Rely on Helm to create self-signed certificates by setting `ingress.selfSigned=true`
  ##
  tls: false
  ## @param ingress.selfSigned Create a TLS secret for this ingress record using self-signed certificates generated by Helm
  ##
  selfSigned: false
  ## @param ingress.extraHosts An array with additional hostname(s) to be covered with the ingress record
  ## e.g:
  ## extraHosts:
  ##   - name: forgejo.local
  ##     path: /
  ##
  extraHosts: []
  ## @param ingress.extraPaths An array with additional arbitrary paths that may need to be added to the ingress under the main host
  ## e.g:
  ## extraPaths:
  ## - path: /*
  ##   backend:
  ##     serviceName: ssl-redirect
  ##     servicePort: use-annotation
  ##
  extraPaths: []
  ## @param ingress.extraTls TLS configuration for additional hostname(s) to be covered with this ingress record
  ## ref: https://kubernetes.io/docs/concepts/services-networking/ingress/#tls
  ## e.g:
  ## extraTls:
  ## - hosts:
  ##     - forgejo.local
  ##   secretName: forgejo.local-tls
  ##
  extraTls: []
  ## @param ingress.secrets Custom TLS certificates as secrets
  ## NOTE: 'key' and 'certificate' are expected in PEM format
  ## NOTE: 'name' should line up with a 'secretName' set further up
  ## If it is not set and you're using cert-manager, this is unneeded, as it will create a secret for you with valid certificates
  ## If it is not set and you're NOT using cert-manager either, self-signed certificates will be created valid for 365 days
  ## It is also possible to create and manage the certificates outside of this helm chart
  ## Please see README.md for more information
  ## e.g:
  ## secrets:
  ##   - name: forgejo.local-tls
  ##     key: |-
  ##       -----BEGIN RSA PRIVATE KEY-----
  ##       ...
  ##       -----END RSA PRIVATE KEY-----
  ##     certificate: |-
  ##       -----BEGIN CERTIFICATE-----
  ##       ...
  ##       -----END CERTIFICATE-----
  ##
  secrets: []
  ## @param ingress.extraRules Additional rules to be covered with this ingress record
  ## ref: https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-rules
  ## e.g:
  ## extraRules:
  ## - host: example.local
  ##     http:
  ##       path: /
  ##       backend:
  ##         service:
  ##           name: example-svc
  ##           port:
  ##             name: http
  ##
  extraRules: []

## @section RBAC parameter
## Specifies whether a ServiceAccount should be created
##
serviceAccount:
  ## @param serviceAccount.create Enable the creation of a ServiceAccount for forgejo pods
  ##
  create: true
  ## @param serviceAccount.name Name of the created ServiceAccount
  ## If not set and create is true, a name is generated using the fullname template
  ##
  name: ""
  ## @param serviceAccount.automountServiceAccountToken Auto-mount the service account token in the pod
  ##
  automountServiceAccountToken: false
  ## @param serviceAccount.annotations Additional custom annotations for the ServiceAccount
  ##
  annotations: {}


## @section NetworkPolicy Configuration
##
## NetworkPolicy configuration for forgejo and PostgreSQL
##
networkPolicy:
  ## @param networkPolicy.forgejo.enabled Enable NetworkPolicy for forgejo
  ##
  forgejo:
    enabled: true
    
    ## Ingress rules configuration
    ##
    ingress:
      ## @param networkPolicy.forgejo.ingress.fromIngressController.enabled Allow traffic from Ingress Controller
      ## @param networkPolicy.forgejo.ingress.fromIngressController.namespaceSelector [object] Namespace selector for Ingress Controller
      ## @param networkPolicy.forgejo.ingress.fromIngressController.podSelector [object] Pod selector for Ingress Controller
      ##
      fromIngressController:
        enabled: true
        namespaceSelector: []
        podSelector: []
        # For Ingress-Nginx
        # namespaceSelector:
        #   kubernetes.io/metadata.name: ingress-nginx
        # podSelector:
        #   app.kubernetes.io/component: controller
        #   app.kubernetes.io/instance: ingress-nginx
        #   app.kubernetes.io/name: ingress-nginx
        # Alternative for Traefik:
        # namespaceSelector:
        #   kubernetes.io/metadata.name: traefik
        # podSelector:
        #   app.kubernetes.io/name: traefik
        #   app.kubernetes.io/instance: traefik-traefik
      
      ## @param networkPolicy.forgejo.ingress.fromMonitoring.enabled Allow traffic from monitoring namespace
      ## @param networkPolicy.forgejo.ingress.fromMonitoring.namespaceSelector [object] Namespace selector for monitoring
      ## @param networkPolicy.forgejo.ingress.fromMonitoring.podSelector [object] Pod selector for monitoring
      ##
      fromMonitoring:
        enabled: true
        namespaceSelector:
          kubernetes.io/metadata.name: kube-prometheus-stack
        podSelector:
          app.kubernetes.io/instance: kube-prometheus-stack-prometheus
          app.kubernetes.io/name: prometheus
          prometheus: kube-prometheus-stack-prometheus
    
    ## Egress rules configuration
    ##
    egress:
      ## @param networkPolicy.forgejo.egress.toSMTP.enabled Allow traffic to SMTP servers
      ## @param networkPolicy.forgejo.egress.toSMTP.cidrBlocks CIDR blocks to SMTP
      ##
      toSMTP:
        enabled: true
        cidrBlocks:
          - 0.0.0.0/0
          - ::/0
      
      ## @param networkPolicy.forgejo.egress.toInternet.enabled Allow traffic to Internet
      ## @param networkPolicy.forgejo.egress.toInternet.cidrBlocks CIDR blocks to Internet
      ## @param networkPolicy.forgejo.egress.toInternet.ports [array] Internet ports to allow
      ##
      toInternet:
        enabled: true
        cidrBlocks:
          - 0.0.0.0/0
          - ::/0
        ports:
          - protocol: TCP
            port: 443
          - protocol: UDP
            port: 443
      ## @param networkPolicy.forgejo.egress.extraEgress [array] Add extra ingress rules to the NetworkPolicy (ignored if allowExternalEgress=true)
      ## extraEgress:
      ##   - ports:
      ##       - port: 1234
      ##         protocol: TCP
      ##     to:
      ##       - podSelector:
      ##           matchLabels:
      ##             role: frontend
      ##       - namespaceSelector:
      ##           matchLabels:
      ##             role: frontend
      ##
      extraEgress: []

  ## @param networkPolicy.postgresql.enabled Enable NetworkPolicy for PostgreSQL CNPG
  ##
  postgresql:
    enabled: false
    
    ## Ingress rules configuration
    ##
    ingress:      
      ## @param networkPolicy.postgresql.ingress.fromMonitoring.enabled Allow traffic from monitoring namespace
      ## @param networkPolicy.postgresql.ingress.fromMonitoring.namespaceSelector [object] Namespace selector for monitoring
      ## @param networkPolicy.postgresql.ingress.fromMonitoring.podSelector [object] Pod selector for monitoring
      ##
      fromMonitoring:
        enabled: true
        namespaceSelector:
          kubernetes.io/metadata.name: kube-prometheus-stack
        podSelector:
          app.kubernetes.io/instance: kube-prometheus-stack-prometheus
          app.kubernetes.io/name: prometheus
          prometheus: kube-prometheus-stack-prometheus
      
      ## @param networkPolicy.postgresql.ingress.fromPostgresqlInstances.enabled Allow traffic between PostgreSQL instances
      ##
      fromPostgresqlInstances:
        enabled: true
      
      ## @param networkPolicy.postgresql.ingress.fromCNPG.enabled Allow traffic from CNPG operator
      ## @param networkPolicy.postgresql.ingress.fromCNPG.namespaceSelector [object] Namespace selector for CNPG operator
      ## @param networkPolicy.postgresql.ingress.fromCNPG.podSelector [object] Pod selector for CNPG operator
      ##
      fromCNPG:
        enabled: true
        namespaceSelector:
          kubernetes.io/metadata.name: cnpg-system
        podSelector:
          app.kubernetes.io/name: cloudnative-pg
    
    ## Egress rules configuration
    ##
    egress:
      ## @param networkPolicy.postgresql.egress.toObjectStorage.enabled Allow traffic to Object Storage for backups
      ## @param networkPolicy.postgresql.egress.toObjectStorage.cidrBlocks CIDR blocks for Object Storage
      ##
      toObjectStorage:
        enabled: false
        cidrBlocks:
          - 0.0.0.0/0
          - ::/0

## @section Database parameters

## CloudNativePG Cluster configuration
## Requires CloudNativePG operator to be pre-installed
## ref: https://cloudnative-pg.io/
## @param postgresql.enabled Enable CloudNativePG cluster deployment
## @param postgresql.instances Number of PostgreSQL instances (1 for single instance)
## @skip postgresql.parameters [object] Postgresql parameters
## @param postgresql.storage.size Storage size for PostgreSQL data
## @param postgresql.storage.storageClass Storage class for PostgreSQL PVCs
## @param postgresql.storage.pvcTemplate Additional PVC template configuration for PostgreSQL PVCs
## @param postgresql.database.name Database name
## @param postgresql.database.username Database username
## @param postgresql.database.password Database password
## @param postgresql.database.existingSecret Existing secret with database credentials
## @param postgresql.resources Resource requests and limits for PostgreSQL pod
## @param postgresql.affinity Affinity configuration for PostgreSQL pod
## @param postgresql.tolerations Tolerations for PostgreSQL pod
## @param postgresql.nodeSelector Node selector for PostgreSQL pod
## @param postgresql.backup.enabled Enable Barman plugin WAL backup configuration
## ref: https://cloudnative-pg.io/plugin-barman-cloud/docs/usage/
## @param postgresql.backup.barmanObjectName Barman ObjectStore name for backup
## ref: https://cloudnative-pg.io/plugin-barman-cloud/docs/object_stores/
## @param postgresql.superuserSecret Secret containing superuser credentials for the cluster
## @param postgresql.tls.enabled Enable TLS encryption for the cluster (requires cert-manager)
## ref: https://cloudnative-pg.io/documentation/current/certificates/#server-tls-secret
##
postgresql:
  enabled: true
  instances: 1
  parameters:
      max_connections: "100"
      shared_buffers: "256MB"
  storage:
    size: 10Gi
    storageClass: ""
    pvcTemplate: {}
  database:
    name: forgejo
    username: forgejo
    password: ""
    existingSecret: ""
  resources: {}
  affinity: {}
  tolerations: {}
  nodeSelector: {}
  metrics:
    ## Prometheus Operator PodMonitor configuration
    ##
    podMonitor:
      ## @param postgresql.metrics.podMonitor.enabled if `true`, creates a Prometheus Operator podMonitor (also requires `metrics.enabled` to be `true`)
      ##
      enabled: true
      ## @param postgresql.metrics.podMonitor.namespace Namespace in which Prometheus is running
      ##
      namespace: ""
      ## @param postgresql.metrics.podMonitor.annotations Additional custom annotations for the podMonitor
      ##
      annotations: {}
      ## @param postgresql.metrics.podMonitor.labels Extra labels for the podMonitor
      ##
      labels: {}
      ## @param postgresql.metrics.podMonitor.jobLabel The name of the label on the target service to use as the job name in Prometheus
      ##
      jobLabel: ""
      ## @param postgresql.metrics.podMonitor.honorLabels honorLabels chooses the metric's labels on collisions with target labels
      ##
      honorLabels: false
      ## @param postgresql.metrics.podMonitor.interval Interval at which metrics should be scraped.
      ## ref: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
      ## e.g:
      ## interval: 10s
      ##
      interval: ""
      ## @param postgresql.metrics.podMonitor.scrapeTimeout Timeout after which the scrape is ended
      ## ref: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
      ## e.g:
      ## scrapeTimeout: 10s
      ##
      scrapeTimeout: ""
      ## @param postgresql.metrics.podMonitor.metricRelabelings Specify additional relabeling of metrics
      ##
      metricRelabelings: []
      ## @param postgresql.metrics.podMonitor.relabelings Specify general relabeling
      ##
      relabelings: []

  backup:
    ## @param postgresql.backup.enabled Enable Barman plugin WAL backup configuration
    ##
    enabled: true
    ## @param postgresql.backup.barmanObjectName Barman ObjectStore name for backup of an existing ObjectStore
    barmanObjectName: ""
    ## ref: https://cloudnative-pg.io/docs/1.29/backup#scheduled-backups
    schedule:
      ## @param postgresql.backup.schedule.enabled Enable scheduled backups for the cluster
      ##
      enabled: true
      ## @param postgresql.backup.schedule.cron Cron expression for the backup schedule
      ##
      cron: "0 0 0 * * *"  # At midnight every day
      ## @param postgresql.backup.schedule.backupOwnerReference Backup owner reference for the backup schedule (self or cluster)
      ## ref: https://cloudnative-pg.io/docs/1.29/backup#scheduled-backups
      ##
      backupOwnerReference: "self"
      ## @param postgresql.backup.schedule.method Backup method for the backup schedule (plugin, volumeSnapshot, or barmanObjectStore (default))
      ## ref: https://cloudnative-pg.io/docs/1.29/backup#backup-methods
      method: "plugin"

  ## ref: https://cloudnative-pg.io/plugin-barman-cloud/docs/object_stores/
  barmanObjectStore:
    ## @param postgresql.barmanObjectStore.enabled Enable Barman ObjectStore configuration
    enabled: true
    ## @param postgresql.barmanObjectStore.destinationPath ObjectStore destination path
    ## Format depends on provider: s3://bucket/path, azure://container/path, gs://bucket/path
    destinationPath: ""
    ## @param postgresql.barmanObjectStore.endpointUrl ObjectStore endpoint URL (only for S3-compatible providers)
    endpointUrl: ""
    wal:
      ## @param postgresql.barmanObjectStore.wal.compression Compression algorithm for WAL files (bzip2, gzip, lz4, snappy, zx, zstd, or none)
      ## ref: https://cloudnative-pg.io/plugin-barman-cloud/docs/compression/
      ##
      compression: "bzip2"
      ## @param postgresql.barmanObjectStore.wal.retentionPolicy Retention policy for WAL files (e.g., "30d" for 30 days)
      ## ref: https://cloudnative-pg.io/plugin-barman-cloud/docs/retention
      retentionPolicy: "30d"
    ## S3 Credentials Configuration
    s3Credentials:
      accessKeyId:
        ## @param postgresql.barmanObjectStore.s3Credentials.accessKeyId.name Name of the Kubernetes secret containing the S3 access key ID
        ## @param postgresql.barmanObjectStore.s3Credentials.accessKeyId.key Key in the secret containing the S3 access key ID
        name: ""
        key: "ACCESS_KEY_ID"
      secretAccessKey:
        ## @param postgresql.barmanObjectStore.s3Credentials.secretAccessKey.name Name of the Kubernetes secret containing the S3 secret access key
        ## @param postgresql.barmanObjectStore.s3Credentials.secretAccessKey.key Key in the secret containing the S3 secret access key
        name: ""
        key: "ACCESS_SECRET_KEY"
    ## Azure Credentials Configuration
    azureCredentials:
      connectionString:
        ## @param postgresql.barmanObjectStore.azureCredentials.connectionString.name Name of the Kubernetes secret containing the Azure connection string
        ## @param postgresql.barmanObjectStore.azureCredentials.connectionString.key Key in the secret containing the Azure connection string
        name: ""
        key: "CONNECTION_STRING"
    ## GCS Credentials Configuration
    gcsCredentials:
      applicationCredentials:
        ## @param postgresql.barmanObjectStore.gcsCredentials.applicationCredentials.name Name of the Kubernetes secret containing the GCS application credentials
        ## @param postgresql.barmanObjectStore.gcsCredentials.applicationCredentials.key Key in the secret containing the GCS application credentials
        name: ""
        key: "APPLICATION_CREDENTIALS"
  
  ## @param postgresql.extraPlugins [array] Add extra plugins to the CloudNativePG cluster.
  ##
  extraPlugins: []
  ## @param postgresql.externalClusters [array] Add external clusters to the CloudNativePG cluster to restore a cluster from an object store
  ## ref: https://cloudnative-pg.io/plugin-barman-cloud/docs/usage/#restoring-a-cluster
  ## e.g:
  ## - name: source
  ##   plugin:
  ##     name: barman-cloud.cloudnative-pg.io
  ##     parameters:
  ##       # Recovery Object Store (pull, read-only)
  ##       barmanObjectName: minio-store
  ##       serverName: cluster-example
  ##
  externalClusters: []
  superuserSecret: ""
  tls:
    enabled: true

## External PostgreSQL configuration
## All of these values are only used when postgresql.enabled is set to false
## @param externalDatabase.host Database host
## @param externalDatabase.port Database port number
## @param externalDatabase.username Non-root username for forgejo
## @param externalDatabase.password Password for the non-root username for forgejo
## @param externalDatabase.database forgejo database name
## @param externalDatabase.existingSecret Name of an existing secret resource containing the database credentials
## @param externalDatabase.existingSecretPasswordKey Name of an existing secret key containing the database credentials
##
externalDatabase:
  host: ""
  port: 5432
  username: forgejo
  database: forgejo
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: ""


## @section SMTP Configuration
