{{- if or (not qsdf.Values.existingSecret) (and (not .Values.smtpExistingSecret) .Values.smtpPassword) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  metrics-bearer-token: {{ include "common.secrets.passwords.manage" (dict "secret" (include "common.names.fullname" .) "key" "metrics-bearer-token" "providedValues" (list "metrics.bearerToken") "length" 32 "context" $) }}
  {{- if and .Values.smtp.password (not .Values.smtp.existingSecret) }}
  {{- if .Values.smtp.password }}
  smtp-password: {{ .Values.smtp.password | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
